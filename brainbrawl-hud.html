<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Brawl</title>
<style>
  /* Everything is sized in em against a root font-size set to fit a 160 x 90
     unit stage, so the same markup scales from a phone preview to a projector
     without a single media query. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(95% 75% at 50% 6%, #2f83c9 0%, #1a5f9f 26%, #0e4278 50%, #072a4c 74%, #03121f 100%);
    color: #e8f6ff;
    font-family: "Arial Narrow", "Roboto Condensed", "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }

  /* Vertical light shafts and sparks, drawn instead of shipped as an image. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(90deg, transparent 0 2.6em, rgba(120,205,255,.10) 2.6em 3.0em, transparent 3.0em 4.4em),
      repeating-linear-gradient(90deg, transparent 0 7.5em, rgba(150,225,255,.16) 7.5em 8.0em, transparent 8.0em 11em),
      repeating-linear-gradient(90deg, transparent 0 17em, rgba(190,240,255,.22) 17em 17.5em, transparent 17.5em 26em),
      repeating-linear-gradient(90deg, transparent 0 43em, rgba(110,195,255,.26) 43em 43.9em, transparent 43.9em 61em);
    mask-image: radial-gradient(88% 80% at 50% 45%, #000 55%, transparent 100%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .55;
    background:
      radial-gradient(.14em .14em at 12% 18%, #bfe9ff, transparent 60%),
      radial-gradient(.1em .1em at 78% 12%, #dff5ff, transparent 60%),
      radial-gradient(.12em .12em at 34% 62%, #9fdcff, transparent 60%),
      radial-gradient(.09em .09em at 62% 78%, #cfefff, transparent 60%),
      radial-gradient(.13em .13em at 88% 54%, #aee4ff, transparent 60%),
      radial-gradient(.08em .08em at 48% 30%, #e6f8ff, transparent 60%),
      radial-gradient(.1em .1em at 22% 84%, #bfe9ff, transparent 60%),
      radial-gradient(.09em .09em at 70% 44%, #d8f2ff, transparent 60%);
  }

  .stage {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: 10em repeat(4, 1fr) 23em;
    grid-template-rows: 11em 34em minmax(0, 1fr);
    gap: 1.1em;
    width: 160em; height: 90em;
    padding: 1.5em 2em 1em;
    overflow: hidden;
  }

  /* ------------------------------ team cards ------------------------------ */
  /* A glowing rail sits behind the row, as in the photographed board. */
  .stage::before {
    content: ""; position: absolute; z-index: 0; left: 3em; right: 25em; top: 5.4em; height: .22em;
    background: linear-gradient(90deg, transparent, rgba(160,235,255,.9) 12%, rgba(160,235,255,.9) 88%, transparent);
    filter: blur(.12em); pointer-events: none;
  }
  .team {
    grid-row: 1; position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .05em; padding: .45em .7em .55em;
    border: .16em solid rgba(116, 212, 252, .95); border-radius: .45em;
    background: linear-gradient(180deg, rgba(4, 14, 26, .97), rgba(1, 6, 12, .99));
    box-shadow: 0 0 .9em rgba(90, 205, 255, .55), 0 0 .2em rgba(150, 235, 255, .45),
                inset 0 0 0 .1em rgba(120, 215, 255, .35), inset 0 0 1.1em rgba(30, 120, 200, .35);
    transition: box-shadow .2s, border-color .2s;
  }
  .team.active {
    border-color: #baff4a;
    box-shadow: 0 0 1.4em rgba(184, 255, 74, .85), 0 0 .35em #baff4a,
                inset 0 0 0 .1em rgba(200, 255, 130, .5), inset 0 0 1.2em rgba(150, 255, 90, .22);
  }
  .team .name {
    width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-weight: 800; font-size: 2.25em; line-height: 1.08; letter-spacing: 0; color: #f4fcff;
    text-shadow: 0 0 .5em rgba(150, 225, 255, .85), 0 .05em .12em rgba(0, 0, 0, .8);
  }
  .team .score {
    font-family: "Arial Black", Impact, "Arial Narrow", sans-serif;
    font-size: 4em; line-height: 1.05; color: #f6fcff;
    text-shadow: 0 0 .45em rgba(130, 215, 255, .9), 0 .04em .1em rgba(0, 0, 0, .75);
    font-variant-numeric: tabular-nums;
  }
  .team .score.miss { color: #ffb0bb; }
  .team input.name {
    background: transparent; border: 0; border-bottom: .06em dashed rgba(150, 215, 255, .3);
    font: inherit; color: inherit; text-shadow: inherit; padding: 0 0 .05em; letter-spacing: inherit;
  }
  .team input.name:focus { outline: none; border-bottom-color: #9fe8ff; background: rgba(22, 78, 130, .4); }
  .team-actions { display: flex; gap: .3em; margin-top: .15em; }
  .team-actions button { font-size: .82em; padding: .38em .5em; }

  /* ---------------------------- member columns ---------------------------- */
  .col { display: flex; flex-direction: column; gap: .6em; min-height: 0; justify-content: flex-start; }
  .col.under-card { justify-content: flex-start; }
  .member {
    position: relative; display: flex; align-items: center; justify-content: center;
    flex: 0 0 5.2em; min-height: 2.4em; padding: .35em .8em;
    border: .1em solid rgba(206, 244, 255, .98); border-radius: .38em;
    background: linear-gradient(180deg, #f2fcff 0%, #cbe9fc 15%, #9ed2f2 52%, #67a9d6 100%);
    box-shadow: 0 .14em .34em rgba(0, 16, 34, .55), 0 0 .9em rgba(80, 200, 255, .65),
                inset 0 .16em .2em rgba(255, 255, 255, 1), inset 0 -.3em .5em rgba(14, 70, 122, .45);
  }
  .member .label {
    font-weight: 700; font-size: 1.3em; line-height: 1.1; letter-spacing: .045em;
    color: #062a47; text-shadow: 0 .04em 0 rgba(255, 255, 255, .55);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .member input {
    width: 100%; background: transparent; border: 0; text-align: center;
    font: inherit; font-weight: 700; font-size: 1.3em; letter-spacing: .045em; color: #062a47;
    text-shadow: 0 .04em 0 rgba(255, 255, 255, .55); padding: .1em .2em;
  }
  .member input::placeholder { color: rgba(6, 42, 71, .45); }
  .member input:focus { outline: .12em solid rgba(10, 70, 120, .55); border-radius: .2em; }
  .member.empty { opacity: .35; }

  /* ------------------------- round ladder (left rail) ---------------------- */
  .ladder {
    grid-column: 1; grid-row: 2;
    display: flex; flex-direction: column; gap: 1.5em; padding-top: .6em;
  }
  .rank {
    position: relative; padding-left: 1.5em;
    font-size: 2.1em; font-weight: 700; letter-spacing: .05em; color: rgba(176, 226, 255, .85);
    text-shadow: 0 0 .4em rgba(40, 120, 200, .8);
  }
  .rank::before {
    content: "\00BB"; position: absolute; left: 0; color: rgba(170, 225, 255, .5);
  }
  .rank.current {
    color: #ffffff; text-shadow: 0 0 .6em rgba(160, 235, 255, .95);
  }
  .rank.current::before { color: #9df3ff; text-shadow: 0 0 .6em rgba(120, 235, 255, .95); }
  button.rank { background: none; border: 0; text-align: left; cursor: pointer; font-family: inherit; }
  button.rank:hover { color: #eafaff; }

  /* ------------------------- badge, clock and ring ------------------------ */
  .gadget {
    grid-column: 6; grid-row: 1 / span 3;
    display: flex; flex-direction: column; align-items: center; gap: 1.1em;
  }
  .badge { display: flex; flex-direction: column; align-items: center; gap: .35em; }
  .crest {
    width: 12.5em; padding: .8em; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(2, 13, 26, .9) 54%, rgba(2, 13, 26, .5) 78%, rgba(2, 13, 26, 0) 100%);
    box-shadow: inset 0 0 1.4em rgba(90, 190, 255, .22);
    filter: drop-shadow(0 0 1.1em rgba(0, 10, 22, .8));
  }
  .wordmark {
    display: flex; flex-direction: column; align-items: center;
    font-family: Georgia, "Times New Roman", serif; font-weight: 700; letter-spacing: .09em;
    line-height: .92; text-align: center;
  }
  .wordmark span {
    font-size: 2.5em;
    background: linear-gradient(180deg, #ffffff 0%, #dcecfb 40%, #8fb6d4 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 .18em rgba(80, 190, 255, .85)) drop-shadow(0 .04em .06em rgba(0, 10, 25, .9));
  }
  .lcd {
    position: relative; width: 100%; padding: .5em .7em;
    border: 2px solid rgba(140, 225, 255, .8); border-radius: .35em;
    background: linear-gradient(180deg, #062231, #02111b);
    box-shadow: 0 0 1.4em rgba(80, 190, 255, .45), inset 0 0 1.2em rgba(0, 18, 36, .95);
  }
  .lcd::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(130, 220, 255, .055) 0 .16em, transparent .16em .32em);
  }
  .lcd svg { display: block; width: 100%; height: auto; }
  body[data-view="display"] .ring-label { display: none; }
  .lcd .seg.on { fill: #9fe8ff; filter: drop-shadow(0 0 .16em rgba(140, 235, 255, .95)); }
  .lcd .seg.off { fill: rgba(120, 200, 255, .07); }
  .lcd.critical .seg.on { fill: #ff6677; filter: drop-shadow(0 0 .2em rgba(255, 80, 100, .95)); }
  .ring { position: relative; display: grid; place-items: center; width: 100%; }
  .ring svg { display: block; width: 100%; height: auto; }
  .ring .tick { fill: #2e8dc4; }
  .ring .tick.spent { fill: rgba(150, 45, 65, .5); }
  .ring .tick.hot { fill: #ff3d54; }
  .ring .rim { fill: none; stroke: rgba(120, 215, 255, .8); stroke-width: 2; }
  .ring .face { fill: #071726; }
  .ring .outer { fill: none; stroke: rgba(110, 200, 250, .35); stroke-width: 1; }
  .ring-num {
    position: absolute; font-family: "Arial Black", Impact, sans-serif;
    font-size: 6em; line-height: 1; color: #eefaff;
    text-shadow: 0 0 .3em rgba(140, 235, 255, .9), 0 .04em .1em rgba(0, 0, 0, .7);
    font-variant-numeric: tabular-nums;
  }
  .ring.critical .ring-num { color: #ff6677; text-shadow: 0 0 .7em rgba(255, 80, 100, .95); }
  .ring-label {
    font-size: 1.05em; letter-spacing: .18em; color: rgba(160, 220, 255, .7); text-transform: uppercase;
  }
  .ring-label.hot { color: #ff9aa6; }

  /* ------------------------------ operator deck --------------------------- */
  .deck {
    position: relative; z-index: 2;
    display: flex; flex-wrap: wrap; align-items: center; gap: .5em 0;
    width: 160em; height: 9em; padding: 0 1.4em;
    background: linear-gradient(180deg, rgba(5, 22, 42, .95), rgba(2, 9, 19, .98));
    border-top: 1px solid rgba(110, 190, 255, .35);
    box-shadow: 0 -.4em 1.8em rgba(0, 0, 0, .65);
  }
  .deck .group {
    display: flex; align-items: center; gap: .45em; padding: 0 1em;
    border-left: 1px solid rgba(110, 190, 255, .2);
  }
  .deck .group:first-child { border-left: 0; padding-left: 0; }
  .deck label { font-size: .95em; letter-spacing: .12em; text-transform: uppercase; color: rgba(174, 220, 255, .68); }
  .deck strong.round { font-size: 1.35em; color: #d8f6ff; min-width: 2.4em; text-align: center; }
  .stamp { margin-left: auto; font-size: .95em; letter-spacing: .1em; color: rgba(150, 220, 255, .55); }
  .stamp.fresh { color: #8dffc9; }

  button {
    font-family: inherit; font-weight: 700; font-size: 1em; letter-spacing: .06em; text-transform: uppercase;
    color: #e2f5ff; cursor: pointer;
    background: linear-gradient(180deg, rgba(32, 96, 158, .92), rgba(9, 38, 74, .96));
    border: 1px solid rgba(130, 215, 255, .55); border-radius: .3em;
    padding: .5em .7em;
    box-shadow: inset 0 .1em .2em rgba(255, 255, 255, .22), 0 0 .55em rgba(60, 160, 255, .22);
  }
  button:hover { background: linear-gradient(180deg, rgba(52, 132, 202, .96), rgba(13, 52, 100, .98)); }
  button:active { transform: translateY(.05em); }
  button:disabled { opacity: .38; cursor: default; }
  button.warm { background: linear-gradient(180deg, #1f8351, #0b4029); border-color: #7dffc6; color: #e9fff6; }
  button.cold { background: linear-gradient(180deg, #8f2233, #470f19); border-color: #ff97a4; color: #ffeef0; }
  button.on { border-color: #8dffc9; box-shadow: 0 0 1em rgba(140, 255, 210, .7), inset 0 0 .6em rgba(140, 255, 210, .35); }
  button.chip { padding: .42em .55em; font-size: .9em; background: rgba(12, 44, 78, .9); }

  input[type=number], input[type=text].field {
    font-family: inherit; font-size: 1em; font-weight: 600;
    background: rgba(3, 14, 28, .92); color: #e8f8ff;
    border: 1px solid rgba(120, 200, 255, .4); border-radius: .25em; padding: .4em .45em;
  }
  input[type=number] { width: 4.6em; }
  input:focus { outline: none; border-color: #9fe8ff; box-shadow: 0 0 0 .1em rgba(140, 225, 255, .35); }

  /* ---------------------------- questions drawer -------------------------- */
  .drawer {
    position: fixed; top: 0; right: 0; z-index: 20;
    display: flex; flex-direction: column; gap: .7em;
    width: 30em; height: 100%; padding: 1.1em 1.2em; overflow: auto;
    font-size: 1.15em;
    background: linear-gradient(180deg, rgba(4, 20, 40, .985), rgba(2, 9, 19, .99));
    border-left: 2px solid rgba(120, 205, 255, .55);
    box-shadow: -.6em 0 2em rgba(0, 0, 0, .7);
    transform: translateX(101%); transition: transform .22s ease;
  }
  .drawer.open { transform: none; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 1em; }
  .drawer-head h2 { margin: 0; font-size: 1.4em; letter-spacing: .1em; text-transform: uppercase; color: #def4ff; }
  .drop {
    display: flex; flex-direction: column; gap: .3em; align-items: center; text-align: center;
    padding: 1.1em .8em; border: .12em dashed rgba(130, 210, 255, .55); border-radius: .4em;
    background: rgba(10, 36, 64, .55); color: #cfeaff;
  }
  .drop strong { font-size: 1.1em; letter-spacing: .04em; }
  .drop span { font-size: .9em; color: rgba(180, 222, 255, .6); }
  .drop.hover { border-color: #9df3ff; background: rgba(24, 78, 130, .75); }
  .row { display: flex; flex-wrap: wrap; gap: .45em; align-items: center; }
  .q-status { margin: 0; font-size: .92em; line-height: 1.35; color: rgba(180, 222, 255, .75); }
  .q-preview {
    display: flex; flex-direction: column; gap: .45em; padding: .8em;
    border: 1px solid rgba(120, 200, 255, .35); border-radius: .4em; background: rgba(8, 30, 54, .6);
  }
  .q-head { display: flex; align-items: center; justify-content: space-between; gap: .6em; font-size: .82em; letter-spacing: .12em; text-transform: uppercase; }
  .q-pack { padding: .2em .5em; border-radius: .2em; background: rgba(120, 200, 255, .16); color: #cfeaff; }
  .q-count { color: rgba(180, 222, 255, .6); }
  .q-prompt { margin: 0; font-size: 1.15em; line-height: 1.3; color: #f2fbff; }
  .q-answer { margin: 0; font-size: 1em; line-height: 1.3; color: #a8ffd8; }
  .q-bonus { margin: 0; font-size: .95em; line-height: 1.3; letter-spacing: .04em; color: #ffd88a; }
  .q-pill { margin: auto 0 0; font-size: .8em; letter-spacing: .14em; text-transform: uppercase; color: rgba(150, 220, 255, .55); }

  [hidden] { display: none !important; }
  body[data-view="display"] .deck { display: none; }
  body[data-view="display"] .drawer { display: none; }
</style>
</head>

<footer class="deck" id="deck">
  <div class="group">
    <button id="tossStart" class="warm">Start</button>
    <button id="tossPause">Pause</button>
    <button id="tossReset">Reset</button>
  </div>
  <div class="group">
    <label for="tossCustom">Toss-up</label>
    <button class="chip" data-toss="30">30s</button>
    <button class="chip" data-toss="60">60s</button>
    <button class="chip" data-toss="120">2m</button>

    <label for="bonusValue">Bonus</label>

    <button id="ringReset" class="chip">Ring reset</button>
  </div>
  <div class="group">

  </div>
  <div class="group">
    <button id="openQuestions" class="chip">Questions</button>
    <button id="resetMatch" class="cold">Reset match</button>
  </div>

</footer>

  </div>

    <button id="pickFolder" class="chip">Questions folder</button>
    <button id="pickFiles" class="chip">Choose files</button>
    <button id="clearQuestions" class="chip cold">Clear</button>

  </div>

      { name: 'KW Red', members: ['Marsh', 'Diaz', 'Ford', 'Bell'] },
      { name: 'KW White', members: ['Reed', 'Ortiz', 'Lane', 'Webb'] }
    ];
    return {
      version: 2,
      teams: seeds.map(function (seed) {
        var members = blankMembers();
        seed.members.forEach(function (name, i) { members[i] = name; });
        return { name: seed.name, score: 0, members: members, lamp: '' };
      }),
      active: 0,
      round: 1,
      lightning: false,
      bonusPoints: 5,
      question: 1,
      toss: { running: false, durationMs: 30000, remainingMs: 30000, endsAt: null },
      ring: { running: false, durationMs: 60000, remainingMs: 60000, endsAt: null },
      savedAt: 0
    };
  }

  function normalizeClock(raw, fallbackMs) {
    var clock = { running: false, durationMs: fallbackMs, remainingMs: fallbackMs, endsAt: null };
    if (!raw || typeof raw !== 'object') return clock;
    clock.durationMs = clampInt(raw.durationMs, 1000, 3600000, fallbackMs);
    clock.remainingMs = clampInt(raw.remainingMs, 0, clock.durationMs, clock.durationMs);
    clock.running = !!raw.running;
    clock.endsAt = typeof raw.endsAt === 'number' ? raw.endsAt : null;
    if (clock.running && !clock.endsAt) {
      clock.running = false;
      clock.remainingMs = clock.durationMs;
    }
    return clock;
  }

  function normalize(raw) {
    var next = defaultState();
    if (!raw || typeof raw !== 'object') return next;

    if (Array.isArray(raw.teams)) {
      raw.teams.slice(0, TEAM_COUNT).forEach(function (team, i) {
        if (!team || typeof team !== 'object') return;
        if (typeof team.name === 'string' && team.name) next.teams[i].name = team.name.slice(0, 24);
        next.teams[i].score = clampInt(team.score, -999, 9999, 0);
        next.teams[i].lamp = team.lamp === 'miss' ? 'miss' : '';
        if (Array.isArray(team.members)) {
          for (var s = 0; s < MEMBER_SLOTS; s++) {
            var member = team.members[s];
            next.teams[i].members[s] = typeof member === 'string' ? member.slice(0, 20) : '';
          }
        }
      });
    }

    next.active = clampInt(raw.active, 0, TEAM_COUNT - 1, 0);
    next.round = clampInt(raw.round, 1, ROUNDS, 1);
    next.lightning = !!raw.lightning;
    next.bonusPoints = clampInt(raw.bonusPoints, 1, 50, 5);
    next.question = clampInt(raw.question, 1, 4000, 1);
    next.toss = normalizeClock(raw.toss || raw.clock, 30000);
    next.ring = normalizeClock(raw.ring, 60000);
    // Keep the stamp of the saved copy: dropping it made every poll look like a
    // new write, so an unchanged state was re-applied (and repainted) each second.
    next.savedAt = typeof raw.savedAt === 'number' ? raw.savedAt : 0;
    return next;
  }

  function readStored() {
    try {
      return JSON.parse(window.localStorage.getItem(STORE_KEY) || 'null');
    } catch (err) {
      return null;
    }
  }

  var state = normalize(readStored());

  function writeState() {
    try {
      state.savedAt = Date.now();
      window.localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (err) {
      /* private-mode browsers and a full quota both land here; the page still works */
    }
  }

  function commit() {
    writeState();
    paint();
    paintClock();
  }

  function clockRemaining(clock) {
    if (clock.running && clock.endsAt) return Math.max(0, clock.endsAt - Date.now());
    return Math.max(0, clock.remainingMs);
  }

  /* ------------------------------ stage build ---------------------------- */

  var els = { teams: [], cols: [], ranks: [] };

  function setActive(index) {
    if (state.active === index) return;
    state.active = index;
    commit();
  }

  function setRound(round) {
    var next = Math.max(1, Math.min(ROUNDS, round));
    if (next === state.round) return;
    state.round = next;
    commit();
  }

  function onTeamName(index, event) {
    state.teams[index].name = event.target.value.slice(0, 24);
    writeState();
    paint();
  }

  function onMemberName(index, slot, event) {
    state.teams[index].members[slot] = event.target.value.slice(0, 20);
    writeState();
    paint();
  }

  function buildStage() {
    document.body.setAttribute('data-view', view);

    var ladder = $('ladder');
    for (var r = 1; r <= ROUNDS; r++) {
      var rank = document.createElement(isControl ? 'button' : 'div');
      rank.className = 'rank';
      rank.textContent = ORDINALS[r - 1];
      if (isControl) {
        rank.type = 'button';
        (function (round) {
          rank.addEventListener('click', function () { setRound(round); });
        }(r));
      }
      ladder.appendChild(rank);
      els.ranks.push(rank);
    }

    var stage = $('stage');
    for (var i = 0; i < TEAM_COUNT; i++) {
      var card = document.createElement('div');
      card.className = 'team';
      card.style.gridColumn = String(2 + i);

      var nameEl;
      if (isControl) {
        nameEl = document.createElement('input');
        nameEl.type = 'text';
        nameEl.className = 'name';
        nameEl.maxLength = 24;
        nameEl.setAttribute('aria-label', 'Team ' + (i + 1) + ' name');
        nameEl.addEventListener('input', onTeamName.bind(null, i));
      } else {
        nameEl = document.createElement('div');
        nameEl.className = 'name';
      }

      var scoreEl = document.createElement('div');
      scoreEl.className = 'score';

      card.appendChild(nameEl);
      card.appendChild(scoreEl);

      var actions = null;
      if (isControl) {
        actions = document.createElement('div');
        actions.className = 'team-actions';
        [
          { text: '+10', kind: 'warm', handler: correct },
          { text: 'Bonus', kind: '', handler: bonus },
          { text: '\u22125', kind: 'cold', handler: miss }
        ].forEach(function (spec) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = spec.kind;
          button.textContent = spec.text;
          // Bind the team index now: the loop variable is function-scoped and
          // already reads 4 (one past the last team) when a click arrives, which
          // made every score button throw instead of scoring.
          button.addEventListener('click', (function (index, handler) {
            return function (event) {
              event.stopPropagation();
              handler(index);
            };
          }(i, spec.handler)));
          actions.appendChild(button);
        });
        card.appendChild(actions);
      }

      card.addEventListener('click', function (index) {
        return function () { setActive(index); };
      }(i));

      stage.appendChild(card);

      var col = document.createElement('div');
      col.className = 'col';
      for (var s = 0; s < MEMBER_SLOTS; s++) {
        var box = document.createElement('div');
        box.className = 'member';
        if (isControl) {
          var input = document.createElement('input');
          input.type = 'text';
          input.maxLength = 20;
          input.placeholder = 'Cadet';
          input.setAttribute('aria-label', 'Team ' + (i + 1) + ' member ' + (s + 1));
          input.addEventListener('input', onMemberName.bind(null, i, s));
          box.appendChild(input);
        } else {
          var label = document.createElement('span');
          label.className = 'label';
          box.appendChild(label);
        }
        col.appendChild(box);
      }
      stage.appendChild(col);

      els.teams.push({ card: card, name: nameEl, score: scoreEl, actions: actions });
      els.cols.push(col);
    }
  }

  /* -------------------------------- paint -------------------------------- */

  function paint() {
    for (var i = 0; i < TEAM_COUNT; i++) {
      var team = state.teams[i];
      var card = els.teams[i];

      if (isControl) {
        if (document.activeElement !== card.name && card.name.value !== team.name) card.name.value = team.name;
      } else {
        setText(card.name, team.name);
      }
      setText(card.score, String(team.score));
      card.score.classList.toggle('miss', team.lamp === 'miss');
      card.card.classList.toggle('active', state.active === i);

      var col = els.cols[i];
      col.style.gridColumn = String(2 + i);
      col.style.gridRow = state.active === i ? '2' : '3';

      for (var s = 0; s < MEMBER_SLOTS; s++) {
        var slot = col.children[s];
        var value = team.members[s] || '';
        if (isControl) {
          var input = slot.firstElementChild;
          if (document.activeElement !== input && input.value !== value) input.value = value;
          slot.classList.toggle('empty', !value);
        } else {
          slot.hidden = !value;
          setText(slot.firstElementChild, value);
        }
      }

      if (isControl && card.actions) {
        var bonusButton = card.actions.children[1];
        bonusButton.disabled = state.lightning;
        bonusButton.title = state.lightning
          ? 'No bonus points in the lightning round'
          : 'Add ' + state.bonusPoints + ' bonus points to ' + team.name;
      }
    }

    els.ranks.forEach(function (rank, index) {
      rank.classList.toggle('current', index + 1 === state.round);
    });

    if (isControl) {
      setText($('roundNow'), ORDINALS[state.round - 1]);
      var lightning = $('lightning');
      lightning.classList.toggle('on', state.lightning);
      lightning.textContent = state.lightning ? 'Lightning on' : 'Lightning';
      var bonusValue = $('bonusValue');
      if (document.activeElement !== bonusValue && String(state.bonusPoints) !== bonusValue.value) {
        bonusValue.value = String(state.bonusPoints);
      }
      paintDeckClock();
    }
  }

  function paintDeckClock() {
    var toss = $('tossStart');
    var pause = $('tossPause');
    if (!toss || !pause) return;
    toss.disabled = state.toss.running;
    pause.disabled = !state.toss.running;
    var ringStart = $('ringStart');
    if (ringStart) {
      ringStart.disabled = state.lightning;
      ringStart.textContent = state.ring.running ? 'Bonus running' : 'Start bonus';
    }
  }

  /* -------------------------------- clock -------------------------------- */

  var SEG_SHAPES = {
    a: [7, 2, 26, 6],
    b: [33, 7, 6, 26],
    c: [33, 37, 6, 26],
    d: [7, 62, 26, 6],
    e: [1, 37, 6, 26],
    f: [1, 7, 6, 26],
    g: [7, 32, 26, 6]
  };
  var DIGIT_SEGS = {
    '0': 'abcdef', '1': 'bc', '2': 'abdeg', '3': 'abcdg', '4': 'bcfg',
    '5': 'acdfg', '6': 'acdefg', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg'
  };
  var lcdDigits = [];

  function buildLcd() {
    var svg = $('lcdSvg');
    [0, 42, 100, 142].forEach(function (x) {
      var group = document.createElementNS(NS, 'g');
      group.setAttribute('transform', 'translate(' + x + ',0)');
      var segs = {};
      Object.keys(SEG_SHAPES).forEach(function (key) {
        var shape = SEG_SHAPES[key];
        var rect = document.createElementNS(NS, 'rect');
        rect.setAttribute('x', shape[0]);
        rect.setAttribute('y', shape[1]);
        rect.setAttribute('width', shape[2]);
        rect.setAttribute('height', shape[3]);
        rect.setAttribute('rx', 1.6);
        rect.setAttribute('class', 'seg off');
        group.appendChild(rect);
        segs[key] = rect;
      });
      svg.appendChild(group);
      lcdDigits.push(segs);
    });
    [24, 40].forEach(function (y) {
      var dot = document.createElementNS(NS, 'rect');
      dot.setAttribute('x', 87);
      dot.setAttribute('y', y);
      dot.setAttribute('width', 7);
      dot.setAttribute('height', 7);
      dot.setAttribute('rx', 1.4);
      dot.setAttribute('class', 'seg on');
      svg.appendChild(dot);
    });
  }

  function lcdPaint(text) {
    for (var i = 0; i < 4; i++) {
      var lit = DIGIT_SEGS[text.charAt(i)] || '';
      var segs = lcdDigits[i];
      for (var key in segs) {
        segs[key].setAttribute('class', lit.indexOf(key) >= 0 ? 'seg on' : 'seg off');
      }
    }
  }

  var TICKS = 60;
  var tickEls = [];

  function buildRing() {
    var svg = $('ringSvg');
    var face = document.createElementNS(NS, 'circle');
    face.setAttribute('cx', 110);
    face.setAttribute('cy', 110);
    face.setAttribute('r', 72);
    face.setAttribute('class', 'face');
    svg.appendChild(face);

    var outer = document.createElementNS(NS, 'circle');
    outer.setAttribute('cx', 110);
    outer.setAttribute('cy', 110);
    outer.setAttribute('r', 106);
    outer.setAttribute('class', 'outer');
    svg.appendChild(outer);

    for (var i = 0; i < TICKS; i++) {
      var tick = document.createElementNS(NS, 'rect');
      tick.setAttribute('x', 107.2);
      tick.setAttribute('y', 6);
      tick.setAttribute('width', 5.6);
      tick.setAttribute('height', 19);
      tick.setAttribute('rx', 2.2);
      tick.setAttribute('transform', 'rotate(' + (360 / TICKS) * i + ' 110 110)');
      tick.setAttribute('class', 'tick');
      svg.appendChild(tick);
      tickEls.push(tick);
    }

    var rim = document.createElementNS(NS, 'circle');
    rim.setAttribute('cx', 110);
    rim.setAttribute('cy', 110);
    rim.setAttribute('r', 64);
    rim.setAttribute('class', 'rim');
    svg.appendChild(rim);
  }

  function ringPaint(remainingMs, durationMs) {
    var fraction = durationMs ? Math.max(0, Math.min(1, remainingMs / durationMs)) : 0;
    var lit = Math.round(fraction * TICKS);
    var seconds = Math.ceil(remainingMs / 1000);
    var critical = seconds <= 5 && seconds > 0;

    for (var i = 0; i < TICKS; i++) {
      var on = i < lit;
      tickEls[i].setAttribute('class', 'tick' + (on ? (critical ? ' hot' : '') : ' spent'));
    }

    setText($('ringNum'), String(seconds));
    var ring = $('ring');
    if (ring) ring.classList.toggle('critical', critical);
    var label = $('ringLabel');
    if (label) {
      label.classList.toggle('hot', critical);
      setText(label, state.lightning
        ? 'No bonus \u00b7 Lightning'
        : (state.ring.running ? 'Bonus running' : 'Bonus'));
    }
  }

  function paintClock() {
    var remaining = clockRemaining(state.toss);
    var total = Math.ceil(remaining / 1000);
    var minutes = Math.min(99, Math.floor(total / 60));
    lcdPaint(pad2(minutes) + pad2(total % 60));
    var lcd = $('lcd');
    if (lcd) lcd.classList.toggle('critical', state.toss.running && remaining <= 5000 && remaining > 0);
    ringPaint(clockRemaining(state.ring), state.ring.durationMs);
  }

  /* ------------------------------- scoring ------------------------------- */

  function startClock(clock) {
    if (clock.running) return;
    if (clock.remainingMs <= 0) clock.remainingMs = clock.durationMs;
    clock.endsAt = Date.now() + clock.remainingMs;
    clock.running = true;
  }

  function pauseClock(clock) {
    if (!clock.running) return;
    clock.remainingMs = Math.max(0, clock.endsAt - Date.now());
    clock.running = false;
    clock.endsAt = null;
  }

  function resetClock(clock) {
    clock.running = false;
    clock.endsAt = null;
    clock.remainingMs = clock.durationMs;
  }

  function setDuration(clock, ms) {
    clock.durationMs = ms;
    clock.remainingMs = ms;
    clock.running = false;
    clock.endsAt = null;
  }

  function correct(index) {
    var team = state.teams[index];
    team.score += TOSS_POINTS;
    team.lamp = '';
    state.active = index;
    if (!state.lightning) startClock(state.ring);
    commit();
  }

  function miss(index) {
    var team = state.teams[index];
    team.score += MISS_POINTS;
    team.lamp = 'miss';
    resetClock(state.ring);
    state.active = (index + 1) % TEAM_COUNT;
    commit();
  }

  function bonus(index) {
    if (state.lightning) return;
    state.teams[index].score += state.bonusPoints;
    state.teams[index].lamp = '';
    commit();
  }

  function adopt(rawJson) {
    if (!rawJson) return;
    var parsed;
    try {
      parsed = JSON.parse(rawJson);
    } catch (err) {
      return;
    }
    if (!parsed) return;
    var next = normalize(parsed);
    // Compare content rather than a timestamp: two saves inside the same
    // millisecond carry the same stamp, so the second one was being ignored and
    // the projector kept the older active team.
    if (JSON.stringify(next) === JSON.stringify(state)) return;
    state = next;
    paint();
    paintClock();
  }

  /* ------------------------------- controls ------------------------------ */

  function bindDeck() {
    if (!isControl) return;

    $('tossStart').addEventListener('click', function () { startClock(state.toss); commit(); });
    $('tossPause').addEventListener('click', function () { pauseClock(state.toss); commit(); });
    $('tossReset').addEventListener('click', function () { resetClock(state.toss); commit(); });

    Array.prototype.forEach.call(document.querySelectorAll('[data-toss]'), function (chip) {
      chip.addEventListener('click', function () {
        setDuration(state.toss, Number(chip.getAttribute('data-toss')) * 1000);
        commit();
      });
    });

    $('tossSet').addEventListener('click', function () {
      var seconds = clampInt($('tossCustom').value, 5, 600, 30);
      $('tossCustom').value = String(seconds);
      setDuration(state.toss, seconds * 1000);
      commit();
    });

    $('ringStart').addEventListener('click', function () {
      if (state.lightning) return;
      startClock(state.ring);
      commit();
    });
    $('ringReset').addEventListener('click', function () { resetClock(state.ring); commit(); });

    $('bonusValue').addEventListener('change', function (event) {
      state.bonusPoints = clampInt(event.target.value, 1, 50, 5);
      event.target.value = String(state.bonusPoints);
      commit();
    });

    $('roundPrev').addEventListener('click', function () { setRound(state.round - 1); });
    $('roundNext').addEventListener('click', function () { setRound(state.round + 1); });

    $('lightning').addEventListener('click', function () {
      state.lightning = !state.lightning;
      if (state.lightning) resetClock(state.ring);
      commit();
    });

    $('resetMatch').addEventListener('click', function () {
      var keeper = state.teams.map(function (team) {
        return { name: team.name, members: team.members.slice(), score: 0 };
      });
      state = normalize({
        version: 2,
        teams: keeper,
        bonusPoints: state.bonusPoints,
        question: state.question,
        toss: { durationMs: state.toss.durationMs },
        ring: { durationMs: state.ring.durationMs }
      });
      commit();
      if (typeof renderQuestions === 'function') renderQuestions();
    });

    var drawer = $('drawer');
    function openDrawer(open) {
      drawer.classList.toggle('open', open);
      drawer.setAttribute('aria-hidden', open ? 'false' : 'true');
    }
    $('openQuestions').addEventListener('click', function () { openDrawer(!drawer.classList.contains('open')); });
    $('closeQuestions').addEventListener('click', function () { openDrawer(false); });

    bindQuestions();

    document.addEventListener('keydown', function (event) {
      var tag = (event.target && event.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || event.metaKey || event.ctrlKey) return;
      var key = event.key;
      if (key === ' ') {
        event.preventDefault();
        if (state.toss.running) pauseClock(state.toss); else startClock(state.toss);
        commit();
      } else if (key === 'r' || key === 'R') {
        resetClock(state.toss);
        commit();
      } else if (key >= '1' && key <= '4') {
        setActive(Number(key) - 1);
      } else if (key === 'c' || key === 'C') {
        correct(state.active);
      } else if (key === 'x' || key === 'X') {
        miss(state.active);
      } else if (key === 'b' || key === 'B') {
        bonus(state.active);
      } else if (key === 'ArrowLeft') {
        setRound(state.round - 1);
      } else if (key === 'ArrowRight') {
        setRound(state.round + 1);
      }
    });
  }

  function bindQuestions() {
    if (!isControl) return;

    var drop = $('questionDrop');
    ['dragenter', 'dragover'].forEach(function (type) {
      drop.addEventListener(type, function (event) {
        event.preventDefault();
        drop.classList.add('hover');
      });
    });
    ['dragleave', 'dragend'].forEach(function (type) {
      drop.addEventListener(type, function () { drop.classList.remove('hover'); });
    });
    drop.addEventListener('drop', function (event) {
      event.preventDefault();
      drop.classList.remove('hover');
      if (event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files.length) {
        loadQuestionFiles(event.dataTransfer.files);
      }
    });

    $('pickFolder').addEventListener('click', function () { $('folderInput').click(); });
    $('pickFiles').addEventListener('click', function () { $('filesInput').click(); });
    $('folderInput').addEventListener('change', function (event) {
      loadQuestionFiles(event.target.files);
      event.target.value = '';
    });
    $('filesInput').addEventListener('change', function (event) {
      loadQuestionFiles(event.target.files);
      event.target.value = '';
    });

    $('clearQuestions').addEventListener('click', function () {
      questionSet = emptyQuestionSet();
      saveQuestionSet();
      answerShown = false;
      $('questionPreview').hidden = true;
      setText($('questionStatus'), 'Questions cleared from this laptop.');
      setText($('questionPill'), 'Empty');
    });

    $('questionPrev').addEventListener('click', function () { stepQuestion(-1); });
    $('questionNext').addEventListener('click', function () { stepQuestion(1); });
    $('questionReveal').addEventListener('click', function () {
      answerShown = !answerShown;
      renderQuestions();
    });
  }

  function stepQuestion(delta) {
    var total = questionSet.questions.length;
    if (!total) return;
    var next = Math.min(total, Math.max(1, state.question + delta));
    if (next === state.question) return;
    state.question = next;
    answerShown = false;
    state.savedAt = Date.now();
    writeState();
    paint();
    renderQuestions();
  }

  function fit() {
    var unitsHigh = isControl ? 99 : 90;
    // clientWidth, not innerWidth: innerWidth counts the scrollbar, which made
    // the stage a few pixels too wide and clipped the round ladder on the left.
    var width = document.documentElement.clientWidth || window.innerWidth;
    var height = document.documentElement.clientHeight || window.innerHeight;
    var size = Math.min(width / 160, height / unitsHigh);
    // No font-size floor: a floor larger than the window allows made the stage
    // overflow its box, which pushed the round ladder off the left edge.
    document.documentElement.style.fontSize = Math.max(1, size) + 'px';
  }

  window.__hud = {
    state: function () { return state; },
    view: view
  };

  var QUESTION_KEY = 'brainbrawl.questions.v1';
  var MAX_QUESTIONS = 4000;
  var questionSet = { questions: [], files: [], loadedAt: 0 };
  var answerShown = false;
  var questionRenderKey = '';

  function emptyQuestionSet() {
    return { questions: [], files: [], loadedAt: 0 };
  }

  function firstString() {
    for (var i = 0; i < arguments.length; i++) {
      var value = arguments[i];
      if (typeof value === 'string' && value.trim()) return value.trim();
    }
    return '';
  }

  function afterColon(line) {
    var index = line.indexOf(':');
    return index === -1 ? '' : line.slice(index + 1).trim();
  }

  function stripNumbering(line) {
    return line.replace(/^[-*\d.)\s]+/, '').trim();
  }

  function safeJson(text) {
    try {
      return JSON.parse(text);
    } catch (err) {
      return null;
    }
  }

  function packNameFromFile(name) {
    var base = String(name || 'Questions').split(/[\\/]/).pop();
    base = base.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
    return base || 'Questions';
  }

  function normalizeQuestionEntry(entry, pack) {
    if (!entry || typeof entry !== 'object') return null;
    var prompt = firstString(entry.prompt, entry.question, entry.q, entry.text);
    if (!prompt) return null;

    var hints = [];
    if (Array.isArray(entry.hints)) {
      hints = entry.hints.filter(function (hint) { return typeof hint === 'string' && hint.trim(); });
    }
    var oneHint = firstString(entry.hint, entry.h);
    if (oneHint) hints.push(oneHint);

    return {
      prompt: prompt,
      answer: firstString(entry.answer, entry.a, entry.correct, entry.solution),
      bonus: firstString(entry.bonus, entry.b, entry.bonusQuestion, entry.bonus_question),
      hints: hints,
      points: clampInt(entry.points || entry.p, 0, 1000, 10),
      pack: firstString(entry.pack, entry.category, pack)
    };
  }

  function parseQuestionJson(text, pack) {
    var decoded = safeJson(text);
    if (!decoded) return [];

    var list = Array.isArray(decoded)
      ? decoded
      : (Array.isArray(decoded.questions) ? decoded.questions
        : (Array.isArray(decoded.items) ? decoded.items : null));
    if (!list) return [];

    var packName = Array.isArray(decoded)
      ? pack
      : firstString(decoded.pack, decoded.name, decoded.title, pack);

    var out = [];
    list.forEach(function (entry) {
      var question = normalizeQuestionEntry(entry, packName);
      if (question) out.push(question);
    });
    return out;
  }

  function parseQuestionText(text, pack) {
    var out = [];
    var prompt = null;
    var answer = null;
    var bonus = '';
    var points = 10;
    var hints = [];
    var currentPack = pack;

    function flush() {
      if (prompt && prompt.trim()) {
        out.push({
          prompt: prompt.trim(),
          answer: (answer || '').trim(),
          bonus: bonus.trim(),
          hints: hints.slice(),
          points: points,
          pack: currentPack
        });
      }
      prompt = null;
      answer = null;
      bonus = '';
      points = 10;
      hints = [];
    }

    String(text).replace(/^\uFEFF/, '').split(/\r?\n/).forEach(function (rawLine) {
      var line = rawLine.trim();
      if (!line || line.indexOf('//') === 0) return;

      if (line.charAt(0) === '#') {
        flush();
        currentPack = line.replace(/^#+\s*/, '').trim() || pack;
        return;
      }

      var lower = line.toLowerCase();
      if (/^(q|question)\s*:/.test(lower)) { flush(); prompt = afterColon(line); return; }
      if (/^(a|answer)\s*:/.test(lower)) { answer = afterColon(line); return; }
      if (/^(b|bonus)\s*:/.test(lower)) { bonus = afterColon(line); return; }
      if (/^(h|hint)\s*:/.test(lower)) { hints.push(afterColon(line)); return; }
      if (/^(p|points)\s*:/.test(lower)) { points = clampInt(afterColon(line), 0, 1000, points); return; }
      if (/^(d|difficulty)\s*:/.test(lower)) return;

      if (/\?\s*$/.test(line) && (prompt === null || /^(\d+[.)]|[-*])\s/.test(line))) {
        if (prompt !== null) flush();
        prompt = stripNumbering(line);
        return;
      }

      if (prompt !== null && answer === null) answer = stripNumbering(line);
    });

    flush();
    return out;
  }

  function detectDelimiter(text) {
    var first = String(text).split(/\r?\n/).filter(function (line) { return line.trim(); })[0] || '';
    var tabs = (first.match(/\t/g) || []).length;
    var commas = (first.match(/,/g) || []).length;
    var semis = (first.match(/;/g) || []).length;
    if (tabs && tabs >= commas && tabs >= semis) return '\t';
    if (semis > commas) return ';';
    return ',';
  }

  function splitDelimited(line, delimiter) {
    var cells = [];
    var cell = '';
    var quoted = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line.charAt(i);
      if (quoted) {
        if (ch === '"' && line.charAt(i + 1) === '"') { cell += '"'; i++; }
        else if (ch === '"') { quoted = false; }
        else { cell += ch; }
      } else if (ch === '"') {
        quoted = true;
      } else if (ch === delimiter) {
        cells.push(cell);
        cell = '';
      } else {
        cell += ch;
      }
    }
    cells.push(cell);
    return cells.map(function (value) { return value.trim(); });
  }

  function parseQuestionCsv(text, pack) {
    var lines = String(text).replace(/\r\n/g, '\n').split('\n').filter(function (line) { return line.trim(); });
    if (lines.length < 2) return [];

    var delimiter = detectDelimiter(text);
    var rows = lines.map(function (line) { return splitDelimited(line, delimiter); });
    var header = rows[0].map(function (cell) { return cell.toLowerCase(); });
    var hasHeader = header.some(function (cell) {
      return cell.indexOf('question') === 0 || cell === 'q' || cell === 'prompt';
    });

    var qIndex = 0;
    var aIndex = 1;
    var bIndex = 2;
    if (hasHeader) {
      header.forEach(function (cell, i) {
        if (cell.indexOf('question') === 0 || cell === 'q' || cell === 'prompt') qIndex = i;
        if (cell.indexOf('answer') === 0 || cell === 'a') aIndex = i;
        if (cell.indexOf('bonus') === 0 || cell === 'b') bIndex = i;
      });
      rows = rows.slice(1);
    }

    var out = [];
    rows.forEach(function (row) {
      var prompt = (row[qIndex] || '').trim();
      if (!prompt) return;
      out.push({
        prompt: prompt,
        answer: (row[aIndex] || '').trim(),
        bonus: (row[bIndex] || '').trim(),
        hints: [],
        points: 10,
        pack: pack
      });
    });
    return out;
  }

  function parseAnyText(text, name) {
    var cleaned = String(text || '').replace(/^\uFEFF/, '');
    var pack = packNameFromFile(name);
    var trimmed = cleaned.trim();
    if (!trimmed) return [];

    var attempts = [];
    if (trimmed.charAt(0) === '{' || trimmed.charAt(0) === '[') attempts.push(parseQuestionJson);
    if (/\.(csv|tsv)$/i.test(name)) attempts.push(parseQuestionCsv);
    attempts.push(parseQuestionText);
    if (!/\.(csv|tsv)$/i.test(name)) attempts.push(parseQuestionCsv);
    attempts.push(parseQuestionJson);

    for (var i = 0; i < attempts.length; i++) {
      var found = attempts[i](cleaned, pack);
      if (found && found.length) return found;
    }
    return [];
  }

  function binaryScore(text) {
    if (!text || !text.length) return 0;
    var bad = 0;
    for (var i = 0; i < text.length; i++) {
      var code = text.charCodeAt(i);
      if (code === 0 || code === 0xfffd || (code < 9) || (code > 13 && code < 32)) bad++;
    }
    return bad / text.length;
  }

  function readFileBytes(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(new Uint8Array(reader.result)); };
      reader.onerror = function () { reject(reader.error || new Error('could not be read')); };
      reader.readAsArrayBuffer(file);
    });
  }

  function looksLikeZip(bytes) {
    return bytes.length > 4 && bytes[0] === 0x50 && bytes[1] === 0x4b &&
      (bytes[2] === 0x03 || bytes[2] === 0x05 || bytes[2] === 0x07);
  }

  function looksLikeGzip(bytes) {
    return bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
  }

  function streamInflate(bytes, format) {
    if (typeof window.DecompressionStream !== 'function') {
      return Promise.reject(new Error('this browser cannot open compressed files — unzip it first'));
    }
    var stream = new Blob([bytes]).stream().pipeThrough(new window.DecompressionStream(format));
    return new Response(stream).arrayBuffer().then(function (buffer) {
      return new Uint8Array(buffer);
    });
  }

  async function inflateZip(bytes) {
    var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var end = -1;
    var floor = Math.max(0, bytes.length - 66000);
    for (var i = bytes.length - 22; i >= floor; i--) {
      if (view.getUint32(i, true) === 0x06054b50) { end = i; break; }
    }
    if (end < 0) throw new Error('not a readable archive');

    var count = view.getUint16(end + 10, true);
    var offset = view.getUint32(end + 16, true);
    var entries = [];
    var pointer = offset;

    for (var n = 0; n < count && pointer + 46 <= bytes.length; n++) {
      if (view.getUint32(pointer, true) !== 0x02014b50) break;

      var method = view.getUint16(pointer + 10, true);
      var compressedSize = view.getUint32(pointer + 20, true);
      var nameLength = view.getUint16(pointer + 28, true);
      var extraLength = view.getUint16(pointer + 30, true);
      var commentLength = view.getUint16(pointer + 32, true);
      var localOffset = view.getUint32(pointer + 42, true);
      var name = new TextDecoder().decode(bytes.subarray(pointer + 46, pointer + 46 + nameLength));
      pointer += 46 + nameLength + extraLength + commentLength;

      if (/\/$/.test(name) || compressedSize === 0xffffffff) continue;
      if (method !== 0 && method !== 8) continue;

      var localNameLength = view.getUint16(localOffset + 26, true);
      var localExtraLength = view.getUint16(localOffset + 28, true);
      var dataStart = localOffset + 30 + localNameLength + localExtraLength;
      var raw = bytes.subarray(dataStart, dataStart + compressedSize);
      var inflated = method === 8 ? await streamInflate(raw, 'deflate-raw') : raw;
      entries.push({ name: name, text: new TextDecoder('utf-8').decode(inflated) });
    }

    return entries;
  }

  function expandContainer(bytes, name) {
    if (looksLikeZip(bytes)) return inflateZip(bytes);
    if (looksLikeGzip(bytes)) {
      return streamInflate(bytes, 'gzip').then(function (inflated) {
        return [{ name: name.replace(/\.gz$/i, ''), text: new TextDecoder('utf-8').decode(inflated) }];
      });
    }
    return Promise.resolve(null);
  }

  async function collectFromFiles(files) {
    var questions = [];
    var report = [];

    for (var i = 0; i < files.length; i++) {
      var file = files[i];
      if (/\.(png|jpe?g|gif|ico|db|ini)$/i.test(file.name) || file.name.charAt(0) === '.') continue;

      try {
        var bytes = await readFileBytes(file);
        var entries = await expandContainer(bytes, file.name);
        var found = [];

        if (entries) {
          entries.forEach(function (entry) {
            if (binaryScore(entry.text) > 0.02) return;
            found = found.concat(parseAnyText(entry.text, entry.name));
          });
        } else {
          var text = new TextDecoder('utf-8').decode(bytes);
          if (binaryScore(text) <= 0.02) found = parseAnyText(text, file.name);
        }

        questions = questions.concat(found);
        report.push({ name: file.name, count: found.length, error: '' });
      } catch (err) {
        report.push({ name: file.name, count: 0, error: (err && err.message) || 'unreadable' });
      }
    }

    return { questions: questions, report: report };
  }

  function saveQuestionSet() {
    try {
      window.localStorage.setItem(QUESTION_KEY, JSON.stringify(questionSet));
    } catch (err) {
      setText($('questionStatus'), questionSet.questions.length +
        ' questions loaded for this session only — too big to remember on this laptop.');
    }
  }

  function loadQuestionSet() {
    try {
      var raw = window.localStorage.getItem(QUESTION_KEY);
      if (raw) {
        var stored = JSON.parse(raw);
        if (stored && Array.isArray(stored.questions)) {
          questionSet = {
            questions: stored.questions,
            files: stored.files || [],
            loadedAt: stored.loadedAt || 0
          };
        }
      }
    } catch (err) {
      questionSet = emptyQuestionSet();
    }

    if (questionSet.questions.length) {
      var total = questionSet.questions.length;
      var files = questionSet.files.length || 1;
      setText($('questionPill'), total + ' ready');
      setText($('questionStatus'), total + ' questions from ' + files + ' file' +
        (files === 1 ? '' : 's') + ' · loaded earlier');
    }
  }

  function applyQuestionSet(questions, report) {
    questionSet = {
      questions: questions.slice(0, MAX_QUESTIONS),
      files: (report || []).filter(function (entry) { return entry.count > 0; }),
      loadedAt: Date.now()
    };
    saveQuestionSet();

    var total = questionSet.questions.length;
    var parts = [total
      ? total + ' question' + (total === 1 ? '' : 's') + ' from ' + questionSet.files.length + ' file' +
        (questionSet.files.length === 1 ? '' : 's')
      : 'No questions found in those files'];

    (report || []).forEach(function (entry) {
      if (!entry.count) parts.push(entry.name + ' — ' + (entry.error || 'nothing readable'));
    });

    setText($('questionStatus'), parts.join(' · '));
    setText($('questionPill'), total ? total + ' ready' : 'Empty');
    answerShown = false;
    questionRenderKey = '';

    if (total && state.question > total) {
      state.question = 1;
      commit();
    }
    renderQuestions();
  }

  function loadQuestionFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;

    setText($('questionStatus'), 'Reading ' + files.length + ' file' + (files.length === 1 ? '' : 's') + '…');
    collectFromFiles(files).then(function (result) {
      applyQuestionSet(result.questions, result.report);
    }).catch(function (err) {
      setText($('questionStatus'), 'Could not read those files: ' + ((err && err.message) || 'unknown error'));
    });
  }

  function renderQuestions() {
    if (!isControl) return;
    var preview = $('questionPreview');
    if (!preview) return;

    var total = questionSet.questions.length;
    if (!total) {
      preview.hidden = true;
      questionRenderKey = '';
      return;
    }

    var index = Math.min(total - 1, Math.max(0, state.question - 1));
    var key = index + '|' + total + '|' + (answerShown ? 1 : 0);
    if (key === questionRenderKey && !preview.hidden) return;
    questionRenderKey = key;

    var question = questionSet.questions[index];
    preview.hidden = false;
    setText($('questionCounter'), 'Question ' + (index + 1) + ' of ' + total);
    setText($('questionPack'), question.pack || 'Questions');
    setText($('questionPrompt'), question.prompt);

    var answer = $('questionAnswer');
    answer.hidden = !answerShown;
    setText(answer, question.answer ? 'Answer: ' + question.answer : 'No answer saved for this question');

    var bonus = $('questionBonus');
    bonus.hidden = !question.bonus;
    setText(bonus, question.bonus ? 'BONUS · ' + question.bonus : '');

    var reveal = $('questionReveal');
    reveal.textContent = answerShown ? 'Hide answer' : 'Show answer';
    reveal.setAttribute('aria-pressed', String(answerShown));
    $('questionPrev').disabled = index <= 0;
    $('questionNext').disabled = index >= total - 1;
  }

  /* ------------------------------ writing ------------------------------ */

/* ------------------------------- start up ------------------------------ */

  fit();
  window.addEventListener('resize', fit);
  buildStage();
  buildLcd();
  buildRing();
  bindDeck();
  paint();
  paintClock();

  /* A timer, not requestAnimationFrame: browsers suspend animation frames for a
     hidden or covered window, which would freeze the projector clock. Frames are
     not needed anyway, since both clocks are computed from their end timestamps. */
  window.setInterval(function () {
    var expired = false;
    [state.toss, state.ring].forEach(function (clock) {
      if (clock.running && Date.now() >= clock.endsAt) {
        clock.running = false;
        clock.remainingMs = 0;
        clock.endsAt = null;
        expired = true;
      }
    });
    if (expired) {
      writeState();
      paint();
    }
    paintClock();
  }, 200);

  if (isControl) {
    loadQuestionSet();
    renderQuestions();
  } else {
    document.title = 'Brain Brawl \u2014 Main Display';
  }

  // Sync between the two windows: storage events where the browser sends them,
  // plus a once-a-second look at the saved state as a fallback (some setups
  // suppress storage events for file:// pages).
  window.addEventListener('storage', function (event) {
    if (event.key !== STORE_KEY || !event.newValue) return;
    adopt(event.newValue);
  });

  window.setInterval(function () {
    var raw;
    try {
      raw = window.localStorage.getItem(STORE_KEY);
    } catch (err) {
      return;
    }
    if (raw) adopt(raw);
  }, 1000);

  // Presets: the operator can pick a different toss-up duration from the console.
  if (isControl) {
    var roundNow = $('roundNow');
    if (roundNow) roundNow.title = 'Round shown on the ladder';
  }
})();

</script>
</body>
</html>
