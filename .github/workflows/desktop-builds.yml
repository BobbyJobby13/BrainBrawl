name: Desktop builds

# GitHub cannot build a macOS app on Windows, or a Windows app on macOS, so each
# target gets its own runner. Run this workflow (Actions -> Desktop builds ->
# Run workflow) and download the installers from the run's Artifacts section:
#
#   Brain-Brawl-macOS     Brain-Brawl-<version>-macOS.dmg
#   Brain-Brawl-Windows   Brain-Brawl-<version>-Windows.msi
#                         Brain-Brawl-<version>-Windows-portable.zip
on:
  workflow_dispatch:
    inputs:
      attach_tag:
        description: 'Release tag the installers and web console are attached to (needs an existing tag)'
        required: false
        default: 'v1.1.0'
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  macos:
    name: macOS disk image (Apple silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable
          cache: true
      - name: Read version from pubspec
        id: meta
        run: |
          version=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n1)
          if [ -z "$version" ]; then
            echo "Could not read a x.y.z version from pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Build the DMG
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          app="build/macos/Build/Products/Release/Brain Brawl.app"
          if [ ! -d "$app" ]; then
            echo "Expected the app bundle at $app"
            exit 1
          fi

          # The Xcode project signs ad-hoc (CODE_SIGN_IDENTITY = "-"). Re-assert it so
          # the copy that ships is valid on Apple silicon without a developer account,
          # and fail here rather than shipping a bundle that will not launch.
          # The entitlements are passed explicitly because re-signing a bundle drops
          # them by default, which would leave the shipped app with whatever the last
          # signer happened to leave behind - and a sandbox that forbids spawning is
          # precisely what stops the host console from opening the player display.
          codesign --force --deep --sign - \
            --entitlements macos/Runner/Release.entitlements "$app"
          codesign --verify --deep --verbose=2 "$app"

          # The disk image holds the app plus a shortcut to /Applications, so the user
          # drags it across like any other Mac install.
          staging="build/dmg-staging"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"

          hdiutil create -volname "Brain Brawl" \
            -srcfolder "$staging" \
            -fs HFS+ \
            -ov -format UDZO \
            "Brain-Brawl-${version}-macOS.dmg"

          # Mount the image here, on the machine that made it. A disk image that
          # cannot be read only shows up on the user's Mac as "not readable by
          # this computer", which points at nothing and costs a round trip.
          hdiutil verify "Brain-Brawl-${version}-macOS.dmg"

          # The same bundle also ships as a zip, so an install never depends on
          # the disk image mounting: unzip, then drag the app to Applications.
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "Brain-Brawl-${version}-macOS.zip"

          ls -lh "Brain-Brawl-${version}-macOS.dmg" "Brain-Brawl-${version}-macOS.zip"
      # The display window is a second process, so a sandbox in the shipped bundle
      # would stop it dead on the user's Mac with no visible reason. Fail the build
      # instead of shipping that.
      - name: Assert the bundle may start a second process
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/Brain Brawl.app"
          entitlements=$(codesign -d --entitlements :- "$app" 2>&1 | tr -d ' \n\t')
          echo "$entitlements"
          case "$entitlements" in
            *com.apple.security.app-sandbox</key><true/>*)
              echo "::error::The app is sandboxed, so the player display cannot launch."
              exit 1
              ;;
          esac
          echo "Sandbox is off: the console may open the display process."
      # Proof that the second window really starts, written where it can be read
      # without Actions log access: the report ships next to the installers.
      - name: Player display self-test
        continue-on-error: true
        run: |
          set -uo pipefail
          app="build/macos/Build/Products/Release/Brain Brawl.app"
          report="Brain-Brawl-macOS-display-selftest.txt"
          {
            echo "# Player display self-test"
            date -u
            echo
            echo "## entitlements"
            codesign -d --entitlements :- "$app" 2>&1 || true
            echo
            echo "## second instance launch"
            open -n "$app" --args --display 2>&1
            echo "open exit=$?"
            sleep 10
            echo
            echo "## processes named Brain Brawl"
            pgrep -fl "Brain Brawl" || echo "none"
            echo
            echo "## shared files in the app temp directory"
            ls -l "$TMPDIR" 2>/dev/null | grep brainbrawl || echo "none"
          } > "$report" 2>&1
          cat "$report"
          pkill -f "Brain Brawl.app/Contents/MacOS/Brain Brawl" || true
      - uses: actions/upload-artifact@v4
        with:
          name: Brain-Brawl-macOS
          path: |
            Brain-Brawl-*-macOS.dmg
            Brain-Brawl-*-macOS.zip
            Brain-Brawl-macOS-display-selftest.txt
          if-no-files-found: error

  windows:
    name: Windows installer + portable (x64)
    # Flutter 3.16.9 only knows the Visual Studio 16 (2019) and 17 (2022) CMake
    # generators and falls back to 16 for anything newer, which fails on a
    # runner whose Visual Studio is newer than 2022. This image ships VS 2022.
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable
          cache: true
      - name: Read version from pubspec
        id: meta
        shell: pwsh
        run: |
          $raw = (Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1).Line
          $version = ($raw -replace '^version:\s*', '') -replace '\+.*$', ''
          if (-not $version) { throw 'Could not read a x.y.z version from pubspec.yaml' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - run: flutter config --enable-windows-desktop
      # Flutter links Windows plugins into the build through symlinks, and
      # Windows only permits those with Developer Mode on. The runner has it
      # off, which fails the build with "requires symlink support" before any
      # code is compiled.
      - name: Enable Developer Mode for plugin symlinks
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" `
            /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
      - name: Record the toolchain
        shell: pwsh
        run: |
          "===== flutter doctor =====" | Out-File -FilePath windows-build.log -Encoding utf8
          flutter doctor -v 2>&1 | Out-File -FilePath windows-build.log -Append -Encoding utf8
          "===== vswhere =====" | Out-File -FilePath windows-build.log -Append -Encoding utf8
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -products * 2>&1 | Out-File -FilePath windows-build.log -Append -Encoding utf8
      - run: flutter pub get
      - name: Build the Windows app
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath windows-build.log -Append
          exit $LASTEXITCODE
      # A failing Windows build leaves no readable trace for anyone without
      # access to the Actions API, so the log is pushed to a throwaway branch
      # where it can be fetched anonymously while the build is being fixed.
      - name: Publish the Windows build log
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path windows-build.log)) { "no log captured" | Out-File windows-build.log }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f windows-build.log
          git commit -m "Windows build log"
          if ($LASTEXITCODE -ne 0) { exit 0 }
          git push -f origin ci-logs
      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y
      - name: Build the MSI
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Chocolatey installs WiX 3.x but does not put it on this process's PATH,
          # so call the tools by their full path.
          $wixHome = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*" -Directory |
            Select-Object -First 1
          if (-not $wixHome) { throw 'WiX Toolset was not installed by Chocolatey' }
          $wix = Join-Path $wixHome.FullName 'bin'
          $release = (Resolve-Path 'build\windows\x64\runner\Release').Path
          $msi = "Brain-Brawl-$env:VERSION-Windows.msi"

          # light resolves a source path in the .wxs against its working directory,
          # which here is the repo root, so a path relative to windows\installer
          # pointed outside the checkout and the link failed. Pass the icon by
          # absolute path instead, and fail loudly if it ever goes missing.
          $icon = (Resolve-Path 'windows\runner\resources\app_icon.ico' -ErrorAction SilentlyContinue)
          if (-not $icon) { throw 'windows\runner\resources\app_icon.ico is missing' }
          $icon = $icon.Path

          # Harvest the whole Flutter bundle (exe, data folder, DLLs) into a WiX fragment.
          & "$wix\heat.exe" dir $release `
            -cg AppFiles -gg -g1 -sfrag -srd -dr INSTALLFOLDER `
            -var var.SourceDir -out windows\installer\Files.wxs
          if ($LASTEXITCODE -ne 0) { throw "heat failed with exit code $LASTEXITCODE" }

          New-Item -ItemType Directory -Force obj | Out-Null
          & "$wix\candle.exe" -arch x64 `
            "-dSourceDir=$release" "-dVersion=$env:VERSION" "-dIconFile=$icon" `
            -out obj\ windows\installer\Product.wxs windows\installer\Files.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle failed with exit code $LASTEXITCODE" }

          & "$wix\light.exe" -out $msi obj\Product.wixobj obj\Files.wixobj
          if ($LASTEXITCODE -ne 0) { throw "light failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $msi)) { throw "light reported success but $msi is missing" }
      - name: Package the portable build
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "Brain-Brawl-${{ steps.meta.outputs.version }}-Windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Brain-Brawl-Windows
          path: |
            Brain-Brawl-*.msi
            Brain-Brawl-*-portable.zip
          if-no-files-found: error

  # Puts the installers on a public release page. The desktop app polls
  # /releases/latest, so without this it would have nothing to point at.
  release:
    name: Attach installers to the GitHub release
    # A tag push publishes automatically. A manual run publishes to the tag typed
    # in the attach_tag box, so an existing release can pick up newer files
    # without cutting a new version - handy while the console is still being
    # tweaked. The installers are already built by the two jobs above, so a
    # manual run costs nothing extra.
    # A push to main publishes too, so the download page keeps pace with the
    # console while it is still being tweaked. It no longer waits for BOTH
    # installers: a failing Windows job used to hide a perfectly good macOS disk
    # image, and the DMG is the only way to install on a Mac.
    if: ${{ always() && (needs.macos.result == 'success' || needs.windows.result == 'success') }}
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
        # A platform that failed produced no artifact; ship the one that built.
        continue-on-error: true
      # The single-file console and the questions folder ship next to the
      # installers, so a team can run a match from any laptop with no install.
      - name: Add the offline web console
        run: |
          set -euo pipefail
          cp brainbrawl-hud.html dist/
          zip -r dist/Brain-Brawl-web.zip brainbrawl-hud.html questions
          ls -l dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.attach_tag) || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.1.0' }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::No tag named ${TAG} exists in this repository. Create the tag first, or type an existing one such as v1.1.0."
            exit 1
          fi
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Nothing was produced by either platform, so there is nothing to publish."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Brain Brawl ${TAG#v}" \
              --generate-notes
          fi

